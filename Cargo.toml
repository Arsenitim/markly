[package]
name = "markly"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "A lightweight, local-first image annotation utility (provisional name)."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/Arsenitim/markly"
keywords = ["annotation", "screenshot", "image", "egui"]
categories = ["graphics", "gui"]
publish = false

[[bin]]
name = "markly"
path = "src/main.rs"

[dependencies]
# GUI. `glow` (OpenGL) backend; nothing in the app depends on glow directly,
# so switching to `wgpu` is a feature-flag change in this file.
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "default_fonts",
    "wayland",
    "x11",
    "clipboard",
] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
tiny-skia = "0.12"
ab_glyph = "0.2"
arboard = { version = "3.7", features = ["wayland-data-control"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
# Only the icon generator example needs the ICO encoder.
image = { version = "0.25", default-features = false, features = ["png", "ico"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

# Image decoding/encoding and rasterisation are painfully slow unoptimised;
# keep debug builds usable.
[profile.dev.package."*"]
opt-level = 2
