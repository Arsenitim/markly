name: Release

# Builds portable archives. Runs on version tags (v*) and can be started
# manually; tagged runs also attach the archives to a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04 # older glibc for wider compatibility
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - name: macos-universal
            os: macos-15
            # Universal binary: Apple Silicon + Intel, merged with lipo.
            target: universal-apple-darwin
            archive: app-zip
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.target }}" == universal-apple-darwin ]]; then
            for t in aarch64-apple-darwin x86_64-apple-darwin; do
              cargo build --release --locked --target "$t"
            done
            mkdir -p target/universal-apple-darwin/release
            lipo -create -output target/universal-apple-darwin/release/markly \
              target/aarch64-apple-darwin/release/markly target/x86_64-apple-darwin/release/markly
            lipo -info target/universal-apple-darwin/release/markly
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || version="dev-${GITHUB_SHA::7}"
          dir="markly-${version}-${{ matrix.name }}"
          mkdir "$dir"
          bin="target/${{ matrix.target }}/release/markly"
          [[ -f "$bin.exe" ]] && bin="$bin.exe"
          cp README.md LICENSE-MIT LICENSE-APACHE "$dir/"
          cp assets/fonts/OFL.txt "$dir/FONT-LICENSE-OFL.txt"
          case "${{ matrix.archive }}" in
            zip)
              cp "$bin" "$dir/"
              7z a "$dir.zip" "$dir" > /dev/null
              echo "ASSET=$dir.zip" >> "$GITHUB_ENV"
              ;;
            app-zip)
              # macOS: a real application bundle so Finder/Dock show the icon.
              app="$dir/Markly.app/Contents"
              mkdir -p "$app/MacOS" "$app/Resources"
              cp "$bin" "$app/MacOS/markly"
              iconutil -c icns assets/icons/macos/markly.iconset -o "$app/Resources/Markly.icns"
              plist_version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
              sed "s/@VERSION@/$plist_version/g" packaging/macos/Info.plist > "$app/Info.plist"
              plutil -lint "$app/Info.plist"
              # Ad-hoc signature (not notarised): required for a modified bundle on Apple Silicon.
              codesign --force --deep --sign - "$dir/Markly.app"
              codesign --verify --verbose "$dir/Markly.app"
              ditto -c -k --keepParent "$dir" "$dir.zip"
              echo "ASSET=$dir.zip" >> "$GITHUB_ENV"
              ;;
            *)
              cp "$bin" "$dir/"
              tar czf "$dir.tar.gz" "$dir"
              echo "ASSET=$dir.tar.gz" >> "$GITHUB_ENV"
              ;;
          esac
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
